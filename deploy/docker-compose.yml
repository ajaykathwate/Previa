name: previa

services:
  postgres:
    image: postgres:17-alpine
    # Local-only credentials match DATABASE_URL in .env.example.
    environment:
      POSTGRES_USER: previa
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: previa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
