# Versioned releases (docs/24-production-deployment.md#ci-and-releases).
# A pushed tag vX.Y.Z builds the binaries, checksums and SBOMs with GoReleaser
# into a draft GitHub release, and pushes multi-architecture images with
# provenance and SBOM attestations to GitHub Container Registry. The jobs run
# in the protected "release" environment, so a maintainer approves before
# anything is published; nothing here deploys.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  binaries:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-24.04
    environment: release
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [server, worker, egress]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push previa-${{ matrix.target }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/previa-${{ matrix.target }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          push: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/previa-${{ matrix.target }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
