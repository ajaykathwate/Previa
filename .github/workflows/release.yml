# Optional published releases (docs/25-production-deployment.md#ci-and-releases).
# Production builds its images on the server from the tagged checkout, so a
# pushed version tag publishes nothing by itself. Run this by hand (Actions ->
# Release -> Run workflow, "Use workflow from" a vX.Y.Z tag on master; any other
# ref stops before anything is built) only when published artifacts are
# wanted, such as for a second host later: it builds the binaries, checksums
# and SBOMs with GoReleaser into a draft GitHub release, and pushes
# multi-architecture images with provenance and SBOM attestations to GitHub
# Container Registry. The jobs run in the "release" environment; nothing here
# deploys.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  binaries:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release only version tags on master
        run: |
          [[ $GITHUB_REF == refs/tags/v* ]] || {
            echo "::error::Run this workflow from a version tag (Use workflow from → Tags), not $GITHUB_REF_NAME."
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on master; tag a commit on master."
            exit 1
          }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-24.04
    environment: release
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [server, worker, egress]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push previa-${{ matrix.target }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/previa-${{ matrix.target }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          push: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/previa-${{ matrix.target }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
