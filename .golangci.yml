version: "2"

# The default linters (errcheck, govet, ineffassign, staticcheck, unused),
# plus checks that keep functions small and the code idiomatic. Generated
# code (sqlc's dbgen, templ's *_templ.go) is excluded by its header.
linters:
  enable:
    - gocognit
    - nestif
    - gocritic
    - revive
  settings:
    # A function past this needs its steps named; split it.
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 6
    # Go's usual style rules. Doc comments on every exported name are not
    # required: names here explain themselves, and comments say why.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      # A scenario test reads best top to bottom, however long.
      - path: _test\.go
        linters:
          - gocognit
          - nestif
