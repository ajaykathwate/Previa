  </style>
  <rect class="frame" x="1.5" y="1.5" width="18" height="18" rx="5.5" fill="none" stroke-width="2.4" opacity=".45"/>
  <rect x="8" y="8" width="18.5" height="18.5" rx="5.5" fill="#9fe02b"/>
  <circle cx="17.25" cy="17.25" r="3.4" fill="#0c1408"/>
</svg>
