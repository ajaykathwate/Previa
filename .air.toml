# Start live reload with: go tool -modfile=tools/go.mod air
root = "."
tmp_dir = "tmp"

[build]
cmd = "make generate && go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go", "templ", "sql", "yaml", "yml"]
exclude_dir = [".git", "tmp", "bin", "tools"]
exclude_regex = ["_templ.go$", "_test.go$"]
exclude_unchanged = true
stop_on_error = true
delay = 1000

[misc]
clean_on_exit = true
