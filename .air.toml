root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
  cmd = "make assets generate && go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "templ", "css", "js", "sql", "sh"]
  include_file = ["go.mod", "go.sum", "sqlc.yaml", "Makefile"]
  exclude_dir = ["tmp", "bin", ".git", "tools"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$", "internal/[^/]+/dbgen/.*\\.go$", "web/static/css/app\\.css(\\..*)?$"]
  exclude_unchanged = true
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  poll = true
  poll_interval = 500

[misc]
  clean_on_exit = true
