root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
  cmd = "go tool -modfile=tools/go.mod templ generate && go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "templ", "css", "js"]
  include_file = ["go.mod", "go.sum"]
  exclude_dir = ["tmp", ".git", "tools"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  exclude_unchanged = true
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  poll = true
  poll_interval = 500

[misc]
  clean_on_exit = true
